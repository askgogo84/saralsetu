<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saralsetu — Your bridge to government</title>
<meta name="description" content="AI-powered citizen assistant for Karnataka government schemes. Check eligibility, apply, and track — in Kannada or English." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* ============================================================
   SetuNxt — design tokens & base styles
   Green + saffron on warm white. Friendly, confident, big.
   ============================================================ */
:root{
  /* palette */
  --green-900:#063a2b;
  --green-800:#0a5640;
  --green-700:#0b6e4f;   /* primary */
  --green-600:#138a64;
  --green-500:#19a87b;
  --green-100:#e4f3ec;
  --green-50:#eef8f2;

  --saffron-600:#d98800;
  --saffron-500:#f4a300;  /* accent */
  --saffron-400:#ffb52e;
  --saffron-100:#fdeccd;

  --ink-900:#0e1b16;
  --ink-700:#26352e;
  --ink-500:#5b6b63;
  --ink-400:#7e8c84;

  --paper:#fbfbf6;       /* warm white page */
  --surface:#ffffff;
  --line:#e7e8e0;
  --line-soft:#eef0e8;

  --whatsapp:#1faa53;

  --shadow-sm:0 1px 2px rgba(14,27,22,.05), 0 2px 8px rgba(14,27,22,.05);
  --shadow-md:0 8px 24px rgba(14,27,22,.08), 0 2px 6px rgba(14,27,22,.05);
  --shadow-lg:0 24px 60px rgba(6,58,43,.16), 0 6px 18px rgba(14,27,22,.08);
  --shadow-green:0 18px 44px rgba(11,110,79,.28);

  --r-sm:12px;
  --r-md:18px;
  --r-lg:26px;
  --r-xl:34px;
  --r-pill:999px;

  --maxw:1200px;

  --font-display:"Bricolage Grotesque", system-ui, sans-serif;
  --font-body:"Hanken Grotesk", system-ui, sans-serif;
  --font-kn:"Noto Sans Kannada", "Hanken Grotesk", sans-serif;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-size:17px;
  line-height:1.55;
}
:lang(kn), .kn{font-family:var(--font-kn); line-height:1.7;}

h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; line-height:1.04; letter-spacing:-.02em; margin:0;}
p{margin:0;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
img{max-width:100%; display:block;}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font-family:var(--font-body); font-weight:700; font-size:17px;
  padding:15px 26px; border-radius:var(--r-pill);
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
  white-space:nowrap; cursor:pointer;
}
.btn:active{transform:translateY(1px) scale(.99);}
.btn-primary{background:var(--green-700); color:#fff; box-shadow:var(--shadow-green);}
.btn-primary:hover{background:var(--green-800); transform:translateY(-2px);}
.btn-accent{background:var(--saffron-500); color:var(--ink-900); box-shadow:0 14px 30px rgba(244,163,0,.32);}
.btn-accent:hover{background:var(--saffron-400); transform:translateY(-2px);}
.btn-ghost{background:#fff; color:var(--green-800); border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--green-500); color:var(--green-700);}
.btn-wa{background:var(--whatsapp); color:#fff; box-shadow:0 14px 30px rgba(31,170,83,.3);}
.btn-wa:hover{filter:brightness(1.05); transform:translateY(-2px);}
.btn-lg{padding:18px 32px; font-size:19px;}
.btn-sm{padding:10px 18px; font-size:15px;}

.pill{
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 15px; border-radius:var(--r-pill);
  font-size:14px; font-weight:600;
  background:var(--green-50); color:var(--green-800);
  border:1px solid var(--green-100);
}

.eyebrow{
  font-weight:700; font-size:14px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--green-600);
}

/* utility */
.center{text-align:center;}
.muted{color:var(--ink-500);}
.section{padding:96px 0;}
.section-tight{padding:64px 0;}

/* reveal on scroll */
.reveal{opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
.reveal.in{opacity:1; transform:none;}

::selection{background:var(--saffron-100); color:var(--green-900);}

/* scrollbar for chat */
.thin-scroll::-webkit-scrollbar{width:8px;}
.thin-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px;}

@media (max-width:860px){
  body{font-size:16px;}
  .section{padding:64px 0;}
  .wrap{padding:0 20px;}
}


@keyframes elbounce { 0%,80%,100%{ transform:translateY(0); opacity:.5 } 40%{ transform:translateY(-6px); opacity:1 } }
@keyframes elpop { from{ opacity:0; transform:translateY(10px) scale(.98) } to{ opacity:1; transform:none } }
.el-pop{ animation:elpop .35s cubic-bezier(.2,.7,.2,1) both; }
:root{ --green-200:#bfe3d2; --green-300:#7fccaa; }
.hero-h1{ font-size:58px; line-height:1.12; }
@media (max-width:1100px){ .hero-h1{ font-size:48px; } }
@media (max-width:600px){ .hero-h1{ font-size:38px; } }
@media (max-width:880px){
  .wrap > div[style*="grid-template-columns: 1.05fr"]{ grid-template-columns:1fr !important; }
}


/* ============================================================
   MOBILE-FIRST RESPONSIVE FIXES — 375px minimum
   ============================================================ */

/* Prevent horizontal overflow on all devices */
html, body { overflow-x: hidden; max-width: 100vw; }
* { box-sizing: border-box; }

/* ---- HEADER RESPONSIVE ---- */
@media (max-width: 860px) {
  /* Hide desktop nav + CTA on mobile */
  .desktop-nav { display: none !important; }
  .desktop-cta { display: none !important; }
  /* Show hamburger */
  .hamburger-btn { display: flex !important; }
}
@media (min-width: 861px) {
  /* Hide hamburger on desktop */
  .hamburger-btn { display: none !important; }
}

/* ---- HERO SECTION MOBILE ---- */
@media (max-width: 860px) {
  /* Stack hero 2-col to 1-col */
  section#top .wrap > div {
    grid-template-columns: 1fr !important;
    gap: 32px !important;
  }
  section#top { padding-top: 20px !important; padding-bottom: 32px !important; }
  /* Phone mockup on mobile: center it, scale down */
  section#top .wrap > div > div:last-child {
    display: flex !important;
    justify-content: center !important;
  }
}

/* ---- STATS BAR MOBILE ---- */
@media (max-width: 600px) {
  section[style*="green-900"] .wrap,
  div[style*="grid-template-columns: repeat(4"] {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 0 !important;
  }
  /* Remove right border from even items */
  section[style*="green-900"] .wrap > div:nth-child(2),
  section[style*="green-900"] .wrap > div:nth-child(4) {
    border-right: none !important;
  }
  /* Add bottom border to first row */  
  section[style*="green-900"] .wrap > div:nth-child(1),
  section[style*="green-900"] .wrap > div:nth-child(2) {
    border-bottom: 1px solid rgba(255,255,255,.12);
    padding-bottom: 24px;
    margin-bottom: 0;
  }
  section[style*="green-900"] .wrap > div {
    padding: 24px 8px !important;
  }
}

/* ---- CATEGORIES GRID MOBILE ---- */
@media (max-width: 768px) {
  div[style*="repeat(4,1fr)"] {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}
@media (max-width: 400px) {
  div[style*="repeat(4,1fr)"] {
    grid-template-columns: 1fr !important;
  }
}


/* ---- HERO MOBILE FIXES ---- */
@media (max-width: 480px) {
  /* Search/ask box full width */
  div[style*="border-radius:999"][style*="cursor:"text""] {
    max-width: 100% !important;
  }
  /* WA + trust row stacks */
  div[style*="marginTop:18"][style*="flexWrap:"wrap""] {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 12px !important;
  }
  /* WhatsApp button full width on tiny screens */
  .btn-wa { width: 100% !important; justify-content: center !important; }
}
/* ---- HOW IT WORKS — 3 col to 1 col mobile ---- */
@media (max-width: 768px) {
  div[style*="repeat(3,1fr)"] {
    grid-template-columns: 1fr !important;
  }
}

/* ---- DIFFERENTIATORS — 2 col to 1 col mobile ---- */
@media (max-width: 600px) {
  div[style*="1fr 1fr"] {
    grid-template-columns: 1fr !important;
  }
}

/* ---- COMPARE TABLE MOBILE ---- */
@media (max-width: 640px) {
  div[style*="grid-template-columns: 1fr 1fr"][style*="maxWidth:920"] {
    grid-template-columns: 1fr !important;
  }
}

/* ---- WHATSAPP BAND MOBILE ---- */
@media (max-width: 640px) {
  div[style*="padding:"56px 56px""],
  div[style*='padding:"56px 56px"'],
  div[style*="padding:56px"] {
    padding: 36px 24px !important;
    flex-direction: column !important;
    align-items: flex-start !important;
  }
}

/* ---- FOOTER MOBILE ---- */
@media (max-width: 768px) {
  footer div[style*="grid-template-columns: 1.4fr"] {
    grid-template-columns: 1fr 1fr !important;
    gap: 28px !important;
  }
  footer div[style*="grid-template-columns: 1.4fr"] > div:first-child {
    grid-column: 1 / -1;
  }
}
@media (max-width: 480px) {
  footer div[style*="grid-template-columns: 1.4fr"] {
    grid-template-columns: 1fr !important;
  }
  footer div[style*="justifyContent:"space-between""] {
    flex-direction: column !important;
    text-align: center !important;
  }
  footer div[style*="textAlign:"right""] {
    text-align: center !important;
  }
}

/* ---- ELIGIBILITY PANEL MOBILE ---- */
@media (max-width: 600px) {
  /* Top bar buttons smaller */
  div[style*="zIndex:200"] div[style*="height:66px"] .btn {
    font-size: 13px !important;
    padding: 8px 10px !important;
  }
  /* Chat bubbles full width */
  div[style*="maxWidth:760"] {
    padding: 0 12px !important;
  }
  /* Chip buttons wrap better */  
  div[style*="marginLeft:45"] {
    margin-left: 0 !important;
    margin-top: 8px !important;
  }
}

/* ---- SECTION PADDING MOBILE ---- */
@media (max-width: 480px) {
  .section { padding: 48px 0 !important; }
  .section-tight { padding: 36px 0 !important; }
  .wrap { padding: 0 16px !important; }
}

/* ---- GENERAL GRID OVERFLOW PROTECTION ---- */
@media (max-width: 480px) {
  .hero-h1 { font-size: 32px !important; }
  h2 { font-size: 26px !important; }
  .btn-lg { padding: 14px 22px !important; font-size: 16px !important; }
  .pill { font-size: 12px !important; }
}

/* ---- MOBILE HAMBURGER MENU ---- */
.mobile-nav-overlay {
  display: none;
  position: fixed;
  top: 64px;
  left: 0;
  right: 0;
  background: rgba(251,251,246,.98);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line-soft);
  box-shadow: var(--shadow-md);
  padding: 12px 20px 20px;
  z-index: 49;
  flex-direction: column;
  gap: 0;
}
.mobile-nav-overlay.open { display: flex; }
.mobile-nav-overlay a {
  padding: 14px 0;
  font-weight: 600;
  font-size: 17px;
  color: var(--ink-700);
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--font-body);
}

/* Desktop: show desktop elements, hide mobile */
.desktop-nav { display: flex !important; }
.desktop-actions { display: flex !important; }
.mobile-actions { display: none !important; }

@media (max-width: 768px) {
  .desktop-nav { display: none !important; }
  .desktop-actions { display: none !important; }
  .mobile-actions { display: flex !important; }
}

/* Phone mockup responsive scaling */
@media (max-width: 860px) {
  section#top .wrap > div {
    grid-template-columns: 1fr !important;
  }
  /* Scale phone mockup to fit */
  section#top .wrap > div > div:last-child > div {
    transform: scale(0.82);
    transform-origin: center top;
  }
  section#top .wrap > div > div:last-child {
    margin-top: -20px;
    margin-bottom: -60px;
  }
}
@media (max-width: 420px) {
  section#top .wrap > div > div:last-child > div {
    transform: scale(0.68);
    transform-origin: center top;
  }
  section#top .wrap > div > div:last-child {
    margin-top: -30px;
    margin-bottom: -100px;
  }
}

</style>
</head>

/* reveal-on-scroll: add .reveal to any element, this wires the observer */
function useReveal(){
  useEffect(()=>{
    const els = document.querySelectorAll(".reveal:not(.in)");
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} });
    },{ threshold:0.12, rootMargin:"0px 0px -8% 0px" });
    els.forEach((el,i)=>{ el.style.transitionDelay = (Math.min(i,6)*60)+"ms"; io.observe(el); });
    return ()=> io.disconnect();
  });
}

/* count-up number for stats */
function CountUp({ to, suffix="", dur=1400 }){
  const [n,setN]=useState(0);
  const ref=useRef(null);
  useEffect(()=>{
    let raf, started=false;
    const io=new IntersectionObserver((es)=>{
      if(es[0].isIntersecting && !started){
        started=true;
        const t0=performance.now();
        const tick=(t)=>{
          const p=Math.min(1,(t-t0)/dur);
          const e=1-Math.pow(1-p,3);
          setN(Math.round(to*e));
          if(p<1) raf=requestAnimationFrame(tick);
        };
        raf=requestAnimationFrame(tick);
      }
    },{threshold:0.5});
    if(ref.current) io.observe(ref.current);
    return ()=>{ io.disconnect(); cancelAnimationFrame(raf); };
  },[to]);
  return React.createElement("span",{ref},n.toLocaleString("en-IN"),suffix);
}

/* ============================================================
   SetuNxt — Conversational eligibility flow (full-screen)
   ============================================================ */
const { useState:eUseState, useEffect:eUseEffect, useRef:eUseRef } = React;

function Eligibility({ t, lang, onClose, onWhatsApp }){
  const Q = window.SETU.EL_QUESTIONS;
  // phase: greet -> asking -> thinking -> results
  const [phase,setPhase]=eUseState("greet");
  const [msgs,setMsgs]=eUseState([{from:"bot",text:t.el_greet}]);
  const [step,setStep]=eUseState(-1);          // -1 = greeting shown, 0..n = question index
  const [answers,setAnswers]=eUseState({});
  const [typing,setTyping]=eUseState(false);
  const [freeVal,setFreeVal]=eUseState("");
  const scroller=eUseRef(null);

  // re-greet when language changes mid-flow at the very start
  eUseEffect(()=>{ if(step===-1 && phase==="greet"){ setMsgs([{from:"bot",text:t.el_greet}]); } },[lang]);

  eUseEffect(()=>{
    const el=scroller.current; if(el) el.scrollTo({top:el.scrollHeight,behavior:"smooth"});
  },[msgs,typing,phase]);

  const pushBot=(text,delay=700)=> new Promise(res=>{
    setTyping(true);
    setTimeout(()=>{ setTyping(false); setMsgs(m=>[...m,{from:"bot",text}]); res(); }, delay);
  });

  async function askQuestion(idx){
    const q=Q[idx];
    await pushBot(lang==="kn"?q.kn_q:q.en_q, 750);
    setStep(idx);
    setPhase("asking");
  }

  async function begin(){
    setMsgs(m=>[...m,{from:"user",text:t.el_begin}]);
    await askQuestion(0);
  }

  async function answer(q, value, label){
    setMsgs(m=>[...m,{from:"user",text:label}]);
    const na={...answers,[q.id]:value};
    setAnswers(na);
    setStep(-2); // lock inputs while transitioning
    const next=Q.findIndex((qq,i)=> i>Q.indexOf(q));
    if(next>-1 && next<Q.length){
      await askQuestion(next);
    } else {
      // done -> think -> results
      setPhase("thinking");
      await pushBot(lang==="kn"?"ಒಂದು ಕ್ಷಣ, ೩೨೦+ ಯೋಜನೆ ಪರಿಶೀಲಿಸುತ್ತಿದ್ದೇನೆ…":"One moment — scanning 320+ schemes for you…", 1100);
      await pushBot(t.el_results_title+" ✨", 1400);
      setPhase("results");
    }
  }

  function submitFree(q){
    const v=freeVal.trim(); if(!v) return;
    setFreeVal("");
    answer(q, v, v);
  }

  const matched = window.SETU.SCHEMES.filter(s=>{ try{ return s.match(answers); }catch(e){ return false; } });
  // ensure at least a couple show
  const results = matched.length? matched : window.SETU.SCHEMES.slice(0,3);
  const score = (id)=>{ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))%100; return 82+(h%16); };

  const curQ = step>=0 ? Q[step] : null;

  return React.createElement("div",{style:{
    position:"fixed",inset:0,zIndex:200,background:"var(--paper)",display:"flex",flexDirection:"column"
  }},
    /* top bar */
    React.createElement("div",{style:{
      flexShrink:0,background:"#fff",borderBottom:"1px solid var(--line-soft)",
      padding:"0 20px",height:66,display:"flex",alignItems:"center",justifyContent:"space-between"
    }},
      React.createElement("button",{className:"btn btn-ghost btn-sm",onClick:onClose,style:{border:"none",padding:"8px 12px"}},
        React.createElement(Icon,{name:"arrow",size:18,style:{transform:"rotate(180deg)"}}),
        React.createElement("span",{className:lang==="kn"?"kn":""},t.el_back)),
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
        React.createElement("div",{style:{width:34,height:34,borderRadius:10,background:"var(--green-700)",color:"#fff",display:"grid",placeItems:"center"}},React.createElement(Icon,{name:"bridge",size:19})),
        React.createElement("div",{style:{lineHeight:1.1}},
          React.createElement("div",{style:{fontFamily:"var(--font-display)",fontWeight:800,fontSize:16}},"Setu Assistant"),
          React.createElement("div",{style:{fontSize:12,color:"var(--green-600)",fontWeight:600}},"AI eligibility check"))),
      React.createElement("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
        setMsgs([{from:"bot",text:t.el_greet}]); setStep(-1); setAnswers({}); setPhase("greet"); setTyping(false);
      },style:{border:"none",padding:"8px 12px",color:"var(--ink-400)"}},
        React.createElement("span",{className:lang==="kn"?"kn":""},t.el_restart))
    ),
    /* progress */
    (phase==="asking"||phase==="thinking") && step>=0 ?
      React.createElement("div",{style:{flexShrink:0,height:4,background:"var(--green-50)"}},
        React.createElement("div",{style:{height:"100%",width:((step+1)/Q.length*100)+"%",background:"var(--green-500)",transition:"width .5s ease"}})) : null,

    /* chat scroll */
    React.createElement("div",{ref:scroller,className:"thin-scroll",style:{flex:1,overflowY:"auto",padding:"28px 0"}},
      React.createElement("div",{style:{maxWidth:760,margin:"0 auto",padding:"0 20px",display:"flex",flexDirection:"column",gap:14}},
        msgs.map((m,i)=>React.createElement(Bubble,{key:i,m,lang})),
        typing? React.createElement(Typing,{t,lang}):null,

        /* greeting begin button */
        (phase==="greet"&&!typing)? React.createElement(QuickRow,null,
          React.createElement(Chip,{onClick:begin,primary:true,lang},t.el_begin)) : null,

        /* current question controls */
        (phase==="asking"&&curQ&&!typing)? React.createElement(AnswerControls,{q:curQ,lang,t,onPick:answer,freeVal,setFreeVal,submitFree}) : null,

        /* results */
        (phase==="results")? React.createElement(Results,{t,lang,results,score,onWhatsApp}) : null
      )
    )
  );
}

window.Eligibility = Eligibility;

function App(){
  const [lang,setLang]=React.useState(()=> localStorage.getItem("setu_lang")||"en");

  React.useEffect(()=>{ localStorage.setItem("setu_lang",lang); document.documentElement.lang=lang; },[lang]);

  const t = window.SETU.I18N[lang];

  const onStart=()=> setShowEl(true);

  const { Header, Hero, Stats } = window.HomeParts;

    React.createElement(Header,{t,lang,setLang,onStart}),
    React.createElement(Hero,{t,lang,onStart,onWhatsApp}),
